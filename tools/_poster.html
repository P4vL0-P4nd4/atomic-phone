<!doctype html><html><head><meta charset="utf-8"><title>poster renderer</title>
<script type="module" src="../lib/model-viewer.min.js"></script>
<style>html,body{margin:0;background:transparent}model-viewer{width:900px;height:1100px;background:transparent;--poster-color:transparent}</style></head><body>
<model-viewer id="mv" environment-image="../env/atomic-studio.hdr" exposure="1.35" shadow-intensity="1.1" shadow-softness="0.9" tone-mapping="aces"></model-viewer>
<script>
customElements.whenDefined('model-viewer').then(() => {
  customElements.get('model-viewer').dracoDecoderLocation = '../lib/draco/';
  const P = new URLSearchParams(location.search), mv = document.getElementById('mv');
  mv.cameraOrbit = P.get('o') || '-150deg 78deg auto'; mv.cameraTarget = P.get('t') || 'auto auto auto';
  mv.src = '../models/' + P.get('m') + '.glb';
});
window.capture = async () => { const b = await document.getElementById('mv').toBlob({ idealAspect: true, mimeType: 'image/png' }); return new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(b); }); };
</script></body></html>
